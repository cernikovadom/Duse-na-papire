  <path d="M18 44 C24 43 28 41 32 44 C36 41 40 43 46 44 L46 22 C40 21 36 23 32 20 C28 23 24 21 18 22 Z" fill="#FAF8F5" fill-opacity="0.12" stroke="url(#gold)" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Center spine -->
