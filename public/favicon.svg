<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2520" />
      <stop offset="100%" stop-color="#1A1512" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE5D8" />
      <stop offset="50%" stop-color="#D9C9B8" />
      <stop offset="100%" stop-color="#C4AF98" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#8C7B6B" stroke-width="1.5" stroke-opacity="0.4" />

